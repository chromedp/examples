on: [push, pull_request]
name: Test
jobs:
  build:
    # The workflow does not run the programs. The program fast reads a live
    # website, and a site can change. Then a program fails for a reason that
    # is not in this repository. The workflow makes sure that every program
    # builds against chromedp.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
