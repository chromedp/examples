on:
  schedule:
    # Every night at 05:17 UTC.
    - cron: "17 5 * * *"
  workflow_dispatch:
name: Nightly
jobs:
  chromedp-main:
    # Build the programs against the newest code of chromedp, and not against the
    # release that go.mod names. A change of chromedp that breaks a program
    # shows up here the next night. The workflow does not run the programs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Use the newest chromedp, cdproto and remote
        run: |
          go get github.com/chromedp/chromedp@main github.com/chromedp/chromedp/remote@main github.com/chromedp/cdproto@latest
          go mod tidy
          go list -m github.com/chromedp/chromedp github.com/chromedp/chromedp/remote github.com/chromedp/cdproto
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
